# Builds the MedAdherence Android APK in the cloud with GameCI (Unity in Docker) and
# attaches it to the run as a downloadable artifact.
#
# One-time setup (repository Settings > Secrets and variables > Actions > New secret):
#   UNITY_EMAIL     your Unity account e-mail
#   UNITY_PASSWORD  your Unity account password
#   UNITY_LICENSE   contents of your Unity_lic.ulf personal licence file
#                   (see https://game.ci/docs/github/activation)
#
# Run it: Actions tab > "Build APK" > Run workflow. When it finishes, download
# "MedAdherence-apk" from the run's Artifacts section and unzip it.
name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity secrets are set
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see the comment at the top of build-apk.yml)"
            exit 1
          fi

      # The Unity Android image is large; make room on the runner.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: MedAdherenceUnity/Library
          key: Library-Android-${{ hashFiles('MedAdherenceUnity/Assets/**', 'MedAdherenceUnity/Packages/**', 'MedAdherenceUnity/ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: MedAdherenceUnity
          unityVersion: 2022.3.40f1
          targetPlatform: Android
          # Our own build script creates the scene, applies player settings and
          # writes Builds/Android/MedAdherence.apk (debug-signed, for sideloading).
          buildMethod: MedAdherence.EditorTools.BuildAndroid.Build
          versioning: None
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: MedAdherence-apk
          path: MedAdherenceUnity/Builds/Android/*.apk
          if-no-files-found: error
