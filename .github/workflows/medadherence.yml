# Checks for the MedAdherence Unity app that do not need a Unity licence:
# the engine-free core logic + tests under .NET, and the native Android plugin under javac.
name: MedAdherence

on:
  push:
    paths:
      - "MedAdherenceUnity/**"
      - ".github/workflows/medadherence.yml"
  pull_request:
    paths:
      - "MedAdherenceUnity/**"
      - ".github/workflows/medadherence.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run core tests
        run: dotnet test "MedAdherenceUnity/CoreTests~"

  android-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java plugin against Android 34
        run: |
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$JAR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          fi
          mkdir -p out
          javac -Xlint:all -source 8 -target 8 -d out -cp "$JAR" \
            MedAdherenceUnity/Assets/Plugins/Android/MedAlarm.androidlib/src/main/java/com/chemrob/medalarm/*.java
