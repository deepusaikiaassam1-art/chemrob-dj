# Builds the MedAdherence Android app (no Unity, no secrets needed), runs its unit tests,
# and makes the APK downloadable:
#   - every run: "MedAdherence-apk" in the run's Artifacts section (needs a GitHub login)
#   - pushes to main: a public link that always points at the newest build,
#     https://github.com/<owner>/<repo>/releases/download/apk-latest/MedAdherence.apk
name: Android APK

on:
  push:
    paths:
      - "MedAdherenceAndroid/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "MedAdherenceAndroid/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and APK
        run: gradle -p MedAdherenceAndroid --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK
        run: cp MedAdherenceAndroid/app/build/outputs/apk/debug/app-debug.apk MedAdherence.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedAdherence-apk
          path: MedAdherence.apk
          if-no-files-found: error

      - name: Publish as the "apk-latest" download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MedAdherence.apk \
            --target "$GITHUB_SHA" \
            --title "MedAdherence APK (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download MedAdherence.apk, open it on your Android phone (8.0 or newer) and allow installing from this source. New builds install over old ones and keep your data." \
            --prerelease
