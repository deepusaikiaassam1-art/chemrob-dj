# Builds the MedAdherence Android app (no Unity, no secrets needed), runs its unit tests,
# and makes the APK downloadable:
#   - every run: "MedAdherence-apk" in the run's Artifacts section (needs a GitHub login)
#   - pushes to main: a public link that always points at the newest build,
#     https://github.com/<owner>/<repo>/releases/download/apk-latest/MedAdherence.apk
name: Android APK

on:
  push:
    paths:
      - "MedAdherenceAndroid/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "MedAdherenceAndroid/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: your own release signing key, stored as repository secrets
      # (Settings > Secrets and variables > Actions). Without them the release build is signed
      # with the project's shared test key.
      #   RELEASE_KEYSTORE_BASE64    the .jks file, base64-encoded
      #   RELEASE_KEYSTORE_PASSWORD  keystore password
      #   RELEASE_KEY_ALIAS          key alias (e.g. medadherence)
      #   RELEASE_KEY_PASSWORD       key password (same as the keystore password for PKCS12)
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "MEDADHERENCE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "MEDADHERENCE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MEDADHERENCE_KEY_ALIAS=$KEY_ALIAS"
              echo "MEDADHERENCE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "No release key secrets set: signing with the shared test key."
          fi

      - name: Unit tests and release APK
        run: gradle -p MedAdherenceAndroid --no-daemon testDebugUnitTest assembleRelease

      - name: Name and check the APK
        run: |
          cp MedAdherenceAndroid/app/build/outputs/apk/release/app-release.apk MedAdherence.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs MedAdherence.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: MedAdherence-apk
          path: MedAdherence.apk
          if-no-files-found: error

      - name: Publish as the "apk-latest" download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MedAdherence.apk \
            --target "$GITHUB_SHA" \
            --title "MedAdherence APK (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download MedAdherence.apk, open it on your Android phone (8.0 or newer) and allow installing from this source. New builds install over old ones and keep your data." \
            --prerelease
