plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chemrob.medadherence'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chemrob.medadherence'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.5.0'

        // Phones only: ML Kit's native AI libraries are large, and the x86 copies only serve PC emulators.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    androidResources {
        // The face-recognition model is memory-mapped straight from the APK, so it must be stored uncompressed.
        noCompress 'tflite'
    }

    packagingOptions {
        jniLibs {
            // Compress the native libraries inside the APK (much smaller download; unpacked on install).
            useLegacyPackaging true
        }
    }

    signingConfigs {
        // Fixed test key committed with the project; used for debug builds, and for release builds
        // until your own key is configured.
        shared {
            storeFile file('medadherence-debug.keystore')
            storePassword 'android'
            keyAlias 'medadherence'
            keyPassword 'android'
        }
        // Your private release key. CI provides it from GitHub secrets (see .github/workflows/android-apk.yml);
        // locally, set the same environment variables. Never commit the keystore itself.
        release {
            def ks = System.getenv('MEDADHERENCE_KEYSTORE')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('MEDADHERENCE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MEDADHERENCE_KEY_ALIAS')
                keyPassword System.getenv('MEDADHERENCE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            // Not debuggable; unused code and resources are removed (smaller, and treated as a normal app).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device AI (Google ML Kit, bundled models: works offline, nothing is uploaded).
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
    // Face recognition (SFace model in assets/, run on the phone with TensorFlow Lite).
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    // JVM unit tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
