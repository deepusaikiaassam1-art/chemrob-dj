plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chemrob.medadherence'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chemrob.medadherence'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3.1'

        // Phones only: ML Kit's native AI libraries are large, and the x86 copies only serve PC emulators.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    packagingOptions {
        jniLibs {
            // Compress the native libraries inside the APK (much smaller download; unpacked on install).
            useLegacyPackaging true
        }
    }

    signingConfigs {
        // A fixed key committed with the project (same idea as Android's own debug key), so every
        // downloaded build installs over the previous one and the patient keeps their data.
        // Not for Play Store publishing: create a private release key for that.
        shared {
            storeFile file('medadherence-debug.keystore')
            storePassword 'android'
            keyAlias 'medadherence'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device AI (Google ML Kit, bundled models: works offline, nothing is uploaded).
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'

    // JVM unit tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
